spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

  data:
    redis:
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

logging:
  config: classpath:logback-spring-dev.xml
  level:
    org.hibernate.SQL: DEBUG
